<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoShot CRM</title>

    <meta name="robots" content="noindex,nofollow">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    
    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-mini-width: 72px;
            --header-height: 60px;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
        }
        
        /* Header */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: #fff;
            border-bottom: 1px solid #dee2e6;
            z-index: 1030;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
        }
        
        .app-header .brand {
            font-weight: 600;
            font-size: 1.25rem;
            color: #198754;
            text-decoration: none;
        }
        
        .app-header .user-info {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        /* Sidebar */
        .app-sidebar {
            position: fixed;
            top: var(--header-height);
            left: 0;
            width: var(--sidebar-width);
            height: calc(100vh - var(--header-height));
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            z-index: 1020;
            transition: transform 0.3s ease;
        }

        /* Mini (icons-only) sidebar mode (desktop only) */
        @media (min-width: 769px) {
            body.sidebar-mini .app-sidebar {
                width: var(--sidebar-mini-width);
            }

            body.sidebar-mini .app-main {
                margin-left: var(--sidebar-mini-width);
            }

            body.sidebar-mini .sidebar-section {
                display: none;
            }

            body.sidebar-mini .sidebar-nav .nav-link {
                justify-content: center;
                padding: 0.75rem;
            }

            body.sidebar-mini .sidebar-nav .nav-link i {
                margin-right: 0;
            }

            body.sidebar-mini .sidebar-nav .nav-link span {
                display: none;
            }
        }

        .sidebar-mini-toggle {
            position: fixed;
            bottom: 1rem;
            left: calc(var(--sidebar-width) - 18px);
            z-index: 1031;
            width: 36px;
            height: 36px;
            padding: 0;
            background: #fff;
        }

        body.sidebar-mini .sidebar-mini-toggle {
            left: calc(var(--sidebar-mini-width) - 18px);
        }
        
        .app-sidebar.collapsed {
            transform: translateX(-100%);
        }
        
        .sidebar-nav {
            padding: 1rem 0;
        }
        
        .sidebar-nav .nav-item {
            margin: 0.25rem 0.5rem;
        }
        
        .sidebar-nav .nav-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: #495057;
            text-decoration: none;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }
        
        .sidebar-nav .nav-link:hover {
            background: #e9ecef;
            color: #198754;
        }
        
        .sidebar-nav .nav-link.active {
            background: #198754;
            color: #fff;
        }
        
        .sidebar-nav .nav-link i {
            width: 24px;
            margin-right: 0.75rem;
            font-size: 1.1rem;
        }
        
        .sidebar-section {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #6c757d;
            margin-top: 1rem;
        }
        
        /* Main Content */
        .app-main {
            margin-top: var(--header-height);
            margin-left: var(--sidebar-width);
            padding: 2rem;
            min-height: calc(100vh - var(--header-height));
            transition: margin-left 0.3s ease;
        }
        
        .app-main.expanded {
            margin-left: 0;
        }
        
        /* Page Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e9ecef;
        }
        
        .page-header h1 {
            margin: 0;
            font-size: 1.75rem;
            font-weight: 600;
            color: #212529;
        }
        
        /* Cards */
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid #e9ecef;
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            background: #fff;
            border-bottom: 1px solid #e9ecef;
            font-weight: 600;
        }
        
        /* Status Badges */
        .badge-status {
            padding: 0.5rem 0.75rem;
            font-weight: 500;
            font-size: 0.875rem;
        }
        
        /* Tables */
        .table {
            margin-bottom: 0;
        }
        
        .table thead th {
            border-top: none;
            font-weight: 600;
            color: #495057;
            background: #f8f9fa;
        }
        
        /* Forms */
        .form-label {
            font-weight: 500;
            color: #495057;
            margin-bottom: 0.5rem;
        }
        
        .form-control:focus,
        .form-select:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }
        
        /* Buttons */
        .btn {
            font-weight: 500;
            padding: 0.5rem 1rem;
        }
        
        .btn-success {
            background: #198754;
            border-color: #198754;
        }
        
        .btn-success:hover {
            background: #157347;
            border-color: #146c43;
        }
        
        /* Loading Spinner */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-overlay.d-none {
            display: none !important;
        }
        
        /* Login Page */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }
        
        .login-card .brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-card .brand h1 {
            color: #198754;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .login-card .brand p {
            color: #6c757d;
            margin: 0;
        }
        
        /* Toast Container */
        .toast-container {
            position: fixed;
            top: 80px;
            right: 1rem;
            z-index: 9999;
        }
        
        /* Photo Cards */
        .photo-card {
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .photo-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        
        .photo-card.selected {
            border: 2px solid #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
        }
        
        .photo-select {
            width: 1.5rem;
            height: 1.5rem;
            cursor: pointer;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar-mini-toggle {
                display: none !important;
            }

            .sidebar-backdrop {
                position: fixed;
                top: var(--header-height);
                left: 0;
                width: 100vw;
                height: calc(100vh - var(--header-height));
                background: rgba(0, 0, 0, 0.35);
                z-index: 1015;
                display: none;
            }

            .sidebar-backdrop.show {
                display: block;
            }

            body.sidebar-mobile-open {
                overflow: hidden;
            }

            .app-sidebar {
                transform: translateX(-100%);
            }
            
            .app-sidebar.show {
                transform: translateX(0);
            }
            
            .app-main {
                margin-left: 0;
            }
            
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <script>
        // Support public gallery URLs without hash routing.
        // /g/<public_hash> -> /#/g/<public_hash>
        // /galleries/access/<token> (legacy) -> /#/gallery-access/<token>
        (function () {
            try {
                if (window.location.hash) return;
                const path = window.location.pathname || '';

                const m1 = path.match(/^\/g\/([^\/]+)\/?$/);
                if (m1) {
                    window.location.replace(`/#/g/${m1[1]}`);
                    return;
                }

                const m2 = path.match(/^\/galleries\/access\/([^\/]+)\/?$/);
                if (m2) {
                    window.location.replace(`/#/gallery-access/${m2[1]}`);
                }
            } catch (e) {
                // ignore
            }
        })();
    </script>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay d-none">
        <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Ładowanie...</span>
        </div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- App Container (hidden until logged in) -->
    <div id="appContainer" class="d-none">
        <!-- Header -->
        <header class="app-header">
            <button class="btn btn-link text-dark d-md-none" id="sidebarToggle">
                <i class="bi bi-list fs-4"></i>
            </button>
            <a href="#/dashboard" class="brand ms-3 ms-md-0 d-flex align-items-center gap-2">
                <img id="appBrandLogo" class="d-none" alt="Logo" style="height: 28px; width: auto;" />
                <i id="appBrandIcon" class="bi bi-camera-fill"></i>
                <span id="appBrandText">EcoShot CRM</span>
            </a>
            <div class="user-info">
                <span id="currentUserName" class="text-muted">Użytkownik</span>
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#/profile"><i class="bi bi-person"></i> Profil</a></li>
                        <li><a class="dropdown-item" href="#/settings"><i class="bi bi-gear"></i> Ustawienia</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Wyloguj</a></li>
                    </ul>
                </div>
            </div>
        </header>
        
        <!-- Sidebar -->
        <aside class="app-sidebar" id="appSidebar">
            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Navigation will be dynamically generated by sidebar.js -->
            </nav>
        </aside>

        <!-- Mobile sidebar backdrop -->
        <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

        <!-- Desktop mini-sidebar toggle (icons-only) -->
        <button class="btn btn-light border rounded-circle d-none d-md-inline-flex align-items-center justify-content-center sidebar-mini-toggle" id="sidebarMiniToggle" type="button" aria-label="Zwiń/rozwiń sidebar" title="Zwiń/rozwiń sidebar">
            <i class="bi bi-chevron-left"></i>
        </button>
        
        <!-- Main Content -->
        <main class="app-main" id="appMain">
            <div id="viewContainer">
                <!-- Views will be dynamically loaded here -->
            </div>
        </main>
    </div>
    
    <!-- Login Container (shown when not logged in) -->
    <div id="loginContainer">
        <!-- Login view will be loaded here -->
    </div>
    
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Charts (for Reports revenue chart) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- App JS Modules -->
    <script type="module">
        // Support shareable client links like /galleries/access/<token>
        // by rewriting them into our hash-based SPA route.
        (function redirectPublicGalleryPathToHash() {
            try {
                const m = window.location.pathname.match(/^\/galleries\/access\/([^/]+)$/);
                if (m) {
                    const token = m[1];
                    const target = `/#/gallery-access/${encodeURIComponent(token)}`;
                    if (window.location.href !== target) {
                        window.location.replace(target);
                    }
                }
            } catch (_) {
                // ignore
            }
        })();

        async function boot() {
            // Use absolute path so it works even when index.html is served for nested paths
            // (e.g. /galleries/access/<token>), where relative imports would resolve incorrectly.
            const mod = await import('/app.js');
            mod.initApp();
        }

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            boot();
        });
    </script>
</body>
</html>
